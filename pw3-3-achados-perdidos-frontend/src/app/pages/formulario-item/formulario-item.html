
<div class="container">

  <h1>{{ idItem ? 'Editar item' : 'Cadastrar item' }}</h1>

  <form [formGroup]="formulario" (ngSubmit)="salvar()">

    <div class="campo">
      <label for="nomeItem">Nome do item *</label>

      <input
        id="nomeItem"
        type="text"
        formControlName="nomeItem"
      >

      <small *ngIf="formulario.get('nomeItem')?.touched && formulario.get('nomeItem')?.hasError('required')">
        O nome do item é obrigatório.
      </small>

      <small *ngIf="formulario.get('nomeItem')?.touched && formulario.get('nomeItem')?.hasError('minlength')">
        O nome deve ter pelo menos 2 caracteres.
      </small>
    </div>

    <div class="campo">
      <label for="localEncontrado">Local encontrado *</label>

      <input
        id="localEncontrado"
        type="text"
        formControlName="localEncontrado"
      >

      <small *ngIf="formulario.get('localEncontrado')?.touched && formulario.get('localEncontrado')?.hasError('required')">
        O local encontrado é obrigatório.
      </small>
    </div>

    <div class="campo">
      <label for="dataAchado">Data e horário do achado *</label>

      <input
        id="dataAchado"
        type="datetime-local"
        formControlName="dataAchado"
      >

      <small *ngIf="formulario.get('dataAchado')?.touched && formulario.get('dataAchado')?.hasError('required')">
        A data do achado é obrigatória.
      </small>
    </div>

    <div class="campo">
      <label for="descricaoDevolucao">Descrição da devolução</label>

      <textarea
        id="descricaoDevolucao"
        formControlName="descricaoDevolucao"
      ></textarea>
    </div>

    <button
      type="submit"
      [disabled]="carregandoItem() || enviandoFormulario()">

      {{ enviandoFormulario()
        ? 'Enviando...'
        : (idItem ? 'Salvar alterações' : 'Cadastrar item') }}

    </button>

    <p class="erro" *ngIf="mensagemErro()">
      {{ mensagemErro() }}
    </p>

    <p *ngIf="carregandoItem()">
      Carregando informações...
    </p>

    <p *ngIf="enviandoFormulario()">
      Enviando dados...
    </p>

  </form>

  <div class="fundo-aviso" *ngIf="mostrarAviso()">
    <div class="aviso">

      <h2>Operação concluída!</h2>

      <p>{{ mensagemSucesso() }}</p>

      <button type="button" (click)="fecharAviso()">
        OK
      </button>

    </div>
  </div>

</div>
